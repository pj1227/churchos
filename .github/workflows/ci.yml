name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

jobs:
  # ── Node / Turbo pipeline ──────────────────────────────────────────────────
  turbo:
    name: Lint · Type-check · Build · Test (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Type-check
        run: pnpm turbo type-check

      - name: Build
        run: pnpm turbo build

      - name: Test (vitest)
        run: pnpm turbo test --filter=@churchos/web --filter=@churchos/admin --filter=@churchos/ui

  # ── Python / FastAPI pipeline ──────────────────────────────────────────────
  pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short
